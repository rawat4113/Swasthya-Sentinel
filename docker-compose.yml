services:
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      APP_ENV: development
      DATABASE_FILE: /app/data/swasthya_sentinel.json
      DATA_MODE: demo
      MIN_GROUP_SIZE: 10
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-CHANGE-ME-local-demo-secret}
      DEMO_USERS_ENABLED: ${DEMO_USERS_ENABLED:-true}
      ACCESS_TOKEN_HOURS: ${ACCESS_TOKEN_HOURS:-8}
    volumes:
      - ./data:/app/data
    ports:
      - "8001:8001"
  dashboard:
    build: .
    command: streamlit run dashboard/Home.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_BASE_URL: http://backend:8001
    depends_on:
      - backend
    ports:
      - "8501:8501"
